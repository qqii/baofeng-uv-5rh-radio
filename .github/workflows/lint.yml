name: Lint

on:
  pull_request:
    branches:
      - master
  workflow_call:

permissions:
  contents: read
  security-events: write

concurrency:
  group: lint-${{ github.ref }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          activate-environment: true
          cache-python: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pre-commit checks
        run: uv run lefthook run pre-commit --all-files --force --no-auto-install --no-tty

      - name: Run ruff format check
        run: uv run ruff format --check generate.py

      - name: Run ruff lint
        run: uv run ruff check generate.py

      - name: Run pyrefly
        run: uv run pyrefly check

      - name: Verify no files were modified
        run: git diff --exit-code

      - name: Run semgrep
        env:
          SEMGREP_RULES: auto
        run: >-
          uv run semgrep ci
          --exclude-rule=bash.lang.security.ifs-tampering.ifs-tampering
          --sarif-output=semgrep.sarif

      - name: Upload semgrep SARIF
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
